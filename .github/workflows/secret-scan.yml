name: Secret scan

# gitleaks over the commits a pull request or a push to main adds. This repo
# is public, so a key or token that reaches a branch here is published.
# Actions > Secret scan > Run workflow scans the whole history instead.
#
# The gitleaks CLI runs from its container image at a pinned version. The
# gitleaks-action wrapper is not used because it needs a license key on
# repositories an organization owns.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the new commits with gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              # A push that creates the branch has no "before"; scan its history.
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                range="$PUSH_BEFORE..$SHA"
              fi
              ;;
          esac
          echo "Scanning ${range:-the whole history} with $GITLEAKS_IMAGE"

          # Run as the runner's user, so git accepts the checkout's ownership.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --verbose --no-banner ${range:+--log-opts=$range}
